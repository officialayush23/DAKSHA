services:
  - type: web
    name: daksha-backend
    runtime: python
    rootDir: .
    buildCommand: pip install -r requirements.txt
    startCommand: python migrations/apply_migrations.py v7 v8 && uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0

      # ── Database (Supabase) ──────────────────────────────────────────────────
      - key: DATABASE_URL
        sync: false   # set manually in Render dashboard
      - key: LANGGRAPH_DB_URL
        sync: false

      # ── Supabase ─────────────────────────────────────────────────────────────
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_JWT_SECRET
        sync: false

      # ── Model gateway ────────────────────────────────────────────────────────
      - key: LLM_PROVIDER
        value: gemini
      - key: GEMINI_MODEL
        value: gemini-3.5-flash
      - key: GEMINI_FALLBACK_MODELS
        value: gemini-3.5-flash-lite,gemini-3-flash-preview,gemini-2.5-flash
      - key: GEMINI_VERTEX_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: AWS_API_KEY_BEDROCK_FOR_XAI
        sync: false
      - key: BEDROCK_MODEL_ID
        value: us.xai.grok-4.7

      # ── Orchestration ────────────────────────────────────────────────────────
      - key: DAKSHA_DOMAIN
        value: commerce
      - key: PROACTIVE_ENABLED
        value: "true"
      - key: KIOSK_OTP_REQUIRED
        value: "true"
      - key: WEBHOOK_SECRET
        sync: false

      # ── Maps (Mapbox) ────────────────────────────────────────────────────────
      - key: MAPBOX_TOKEN
        sync: false
      - key: MAP_BOX_API_KEY
        sync: false

      # ── Redis (optional; in-process fallback when empty) ─────────────────────
      - key: REDIS_URL
        sync: false
      - key: CELERY_ENABLED
        value: "false"

      # ── Email ────────────────────────────────────────────────────────────────
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM_EMAIL
        sync: false
      - key: RESEND_API_KEY
        sync: false

      # ── Embeddings (Nomic) ───────────────────────────────────────────────────
      - key: NOMIC_API_KEY
        sync: false
      - key: EMBEDDING_PROVIDER
        value: nomic
      - key: NOMIC_TEXT_MODEL
        value: nomic-ai/nomic-embed-text-v1.5
      - key: NOMIC_VISION_MODEL
        value: nomic-ai/nomic-embed-vision-v1.5
      - key: NOMIC_MATRYOSHKA_DIM
        value: "768"

      # ── LangChain tracing (optional) ─────────────────────────────────────────
      - key: LANGCHAIN_TRACING_V2
        value: "false"
      - key: LANGCHAIN_API_KEY
        sync: false
      - key: LANGCHAIN_PROJECT
        value: daksha

      # ── Telegram bot (optional) ──────────────────────────────────────────────
      - key: TELEGRAM_TOKEN
        sync: false
